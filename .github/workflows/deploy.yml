name: Deploy to GitHub Pages

# Builds the site and commits the output to the gh-pages branch, which
# GitHub Pages serves (Settings → Pages → Source: Deploy from a branch).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish dist/ to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach publish origin/gh-pages
          cd publish
          git rm -rq --ignore-unmatch .
          cp -R ../dist/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA::7} from master"
          git push origin HEAD:gh-pages
